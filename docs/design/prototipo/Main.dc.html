<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select{font-family:inherit}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.15)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.up{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.sheet{animation:sheet .6s cubic-bezier(.2,.7,.2,1) .1s both}
.glow{animation:glow 6s ease-in-out infinite}
.float{animation:float 5s ease-in-out infinite}
.press{transition:transform .15s cubic-bezier(.4,0,.2,1),box-shadow .2s,background .2s;cursor:pointer}
.press:active{transform:scale(.96)}
.lift:hover{transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:linear-gradient(170deg,#229ED9 0%,#1676B0 45%,#0F5C93 100%);color:#0E2233;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div class="glow" style="position:absolute;top:-90px;right:-70px;width:300px;height:300px;border-radius:50%;background:#2AABEE;filter:blur(30px)"></div>
  <div class="float" style="position:absolute;top:150px;left:-60px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)"></div>

  <div style="position:relative;padding:24px 20px 0">
    <div class="up" style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:40px;height:40px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12689E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M8 11l2.2 2.2L14.5 9"/><path d="M20 20l-3.5-3.5"/></svg>
        </div>
        <span style="font-weight:800;font-size:17px;color:#fff;letter-spacing:-.01em">Citizen Assist</span>
      </div>
      <span style="font-size:13px;font-weight:700;color:#fff;background:rgba(8,40,70,.38);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px;backdrop-filter:blur(14px)">Não oficial</span>
    </div>

    <h1 class="up" style="animation-delay:.1s;margin:26px 0 0;font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.03em;color:#fff">Qual a sua<br>dúvida hoje?</h1>
    <p class="up" style="animation-delay:.18s;margin:10px 0 0;font-size:16px;line-height:1.5;font-weight:500;color:#fff">Respostas simples, sempre com a fonte oficial.</p>

    <div class="up" style="animation-delay:.26s;margin-top:20px;display:flex;flex-direction:column;gap:8px">
      <label for="q" style="font-size:14px;font-weight:700;color:#fff">Sua pergunta</label>
      <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:6px 6px 6px 18px;box-shadow:0 18px 36px -16px rgba(6,40,70,.6)">
        <input id="q" type="text" placeholder="Ex.: como tirar a 2ª via do RG?" style="flex:1;min-width:0;border:0;outline:none;font-size:16px;color:#0E2233;background:transparent;height:44px">
        <button class="press" aria-label="Perguntar" style="width:48px;height:48px;border:0;border-radius:16px;background:#12689E;display:flex;align-items:center;justify-content:center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="sheet" style="position:absolute;left:0;right:0;top:384px;bottom:0;background:#F2F8FC;border-radius:34px 34px 0 0;padding:22px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
    <div class="up" style="animation-delay:.35s;display:flex;gap:8px;overflow-x:auto;align-items:center">
      <span style="flex:none;font-size:13px;font-weight:700;color:#4A6176">Experimente</span>
      <button class="press" style="flex:none;min-height:44px;border:1.5px solid #7C98AD;background:#fff;color:#0E2233;border-radius:999px;padding:0 14px;font-size:14px;font-weight:700">Título de eleitor</button>
      <button class="press" style="flex:none;min-height:44px;border:1.5px solid #7C98AD;background:#fff;color:#0E2233;border-radius:999px;padding:0 14px;font-size:14px;font-weight:700">Meu INSS</button>
    </div>

    <div class="up" style="animation-delay:.42s">
      <h2 style="margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:-.01em">Explorar por tema</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <button class="press lift" style="border:0;text-align:left;background:#fff;border-radius:22px;padding:14px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
          <span style="width:40px;height:40px;border-radius:14px;background:#DDEFFA;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12689E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M14 10h4M14 14h3"/></svg></span>
          <span style="font-size:14px;font-weight:700;color:#0E2233;line-height:1.2">Documentos</span>
        </button>
        <button class="press lift" style="border:0;text-align:left;background:#fff;border-radius:22px;padding:14px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
          <span style="width:40px;height:40px;border-radius:14px;background:#D9F2EF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A7C73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></span>
          <span style="font-size:14px;font-weight:700;color:#0E2233;line-height:1.2">Serviços públicos</span>
        </button>
        <button class="press lift" style="border:0;text-align:left;background:#fff;border-radius:22px;padding:14px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
          <span style="width:40px;height:40px;border-radius:14px;background:#FDE7DF;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8431F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 8h14M7 8l-3 6a3 3 0 006 0L7 8zM17 8l-3 6a3 3 0 006 0l-3-6z"/></svg></span>
          <span style="font-size:14px;font-weight:700;color:#0E2233;line-height:1.2">Direitos</span>
        </button>
      </div>
    </div>

    <div class="up" style="animation-delay:.5s;display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
      <span style="width:40px;height:40px;flex:none;border-radius:50%;background:#DDF3EA;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F7A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <p style="margin:0;font-size:14px;line-height:1.4;color:#4A6176"><b style="color:#0E2233">17 orientações verificadas.</b> Toda resposta mostra a fonte e a data.</p>
    </div>
  </div>

  <nav aria-label="Principal" class="up" style="animation-delay:.6s;position:absolute;left:20px;right:20px;bottom:20px;height:68px;border-radius:26px;background:#0E2233;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 18px 34px -12px rgba(6,24,40,.7)">
    <a href="Main.dc.html" aria-current="page" style="min-width:108px;height:48px;border-radius:18px;background:#fff;color:#0E2233;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12689E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Perguntar</a>
    <a href="Cofre.dc.html" aria-label="Cofre" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></a>
    <a href="Ajustes.dc.html" aria-label="Ajustes" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></a>
  </nav>
</div>
