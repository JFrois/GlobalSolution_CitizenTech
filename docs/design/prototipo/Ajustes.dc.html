<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ajustes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input,select{font-family:inherit}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.15)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.up{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.sheet{animation:sheet .6s cubic-bezier(.2,.7,.2,1) .1s both}
.glow{animation:glow 6s ease-in-out infinite}
.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.2) both}
.press{transition:transform .15s cubic-bezier(.4,0,.2,1),background .2s,color .2s,box-shadow .2s;cursor:pointer}
.press:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:linear-gradient(170deg,#229ED9 0%,#1676B0 45%,#0F5C93 100%);color:#0E2233;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div class="glow" style="position:absolute;top:-90px;right:-70px;width:300px;height:300px;border-radius:50%;background:#2AABEE;filter:blur(30px)"></div>

  <div style="position:relative;padding:28px 20px 0">
    <h1 class="up" style="margin:0;font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.03em;color:#fff">Ajustes</h1>
    <p class="up" style="animation-delay:.08s;margin:8px 0 0;font-size:16px;font-weight:500;color:#fff">Do seu jeito, e só o necessário.</p>
  </div>

  <div class="sheet" style="position:absolute;left:0;right:0;top:150px;bottom:0;background:#F2F8FC;border-radius:34px 34px 0 0;padding:22px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
    <div class="up" style="animation-delay:.2s;background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
      <label for="uf" style="font-size:15px;font-weight:700">Seu estado</label>
      <select id="uf" style="height:48px;border:1.5px solid #7C98AD;border-radius:14px;padding:0 12px;font-size:16px;color:#0E2233;background:#fff"><option>[UF]</option></select>
      <span style="font-size:14px;color:#4A6176">Usado quando o procedimento muda de estado para estado.</span>
    </div>

    <div class="up" style="animation-delay:.3s;background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 20px -12px rgba(14,34,51,.35)">
      <div style="font-size:15px;font-weight:700">Resumo da manhã · temas</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="press" onClick="{{t1.tap}}" aria-pressed="{{t1.on}}" style="{{t1.style}}"><sc-if value="{{t1.on}}" hint-placeholder-val="{{ true }}"><svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>Documentos</button>
        <button class="press" onClick="{{t2.tap}}" aria-pressed="{{t2.on}}" style="{{t2.style}}"><sc-if value="{{t2.on}}" hint-placeholder-val="{{ false }}"><svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>Serviços</button>
        <button class="press" onClick="{{t3.tap}}" aria-pressed="{{t3.on}}" style="{{t3.style}}"><sc-if value="{{t3.on}}" hint-placeholder-val="{{ false }}"><svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></sc-if>Direitos</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <label for="hora" style="font-size:15px;font-weight:600">Horário</label>
        <input id="hora" type="text" value="07:30" style="width:96px;height:44px;border:1.5px solid #7C98AD;border-radius:14px;text-align:center;font-size:16px;color:#0E2233">
      </div>
      <span style="font-size:13px;font-weight:700;color:#4A6176">Manchetes: notícias, fonte não oficial</span>
    </div>

    <button class="up press" style="animation-delay:.4s;min-height:54px;border:0;border-radius:999px;background:#12689E;color:#fff;font-size:16px;font-weight:800;box-shadow:0 16px 30px -14px rgba(18,104,158,.8)">Salvar</button>

    <div class="up" style="animation-delay:.5s;border:1.5px solid #E7B4A3;background:#FFF5F1;border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:12px">
      <div style="flex:1"><div style="font-size:15px;font-weight:800;color:#8A2B0E">Apagar meus dados</div><div style="font-size:13px;line-height:1.4;color:#5E1F0B">Remove cofre, tarefas e preferências. Não dá para desfazer.</div></div>
      <button class="press" style="min-height:44px;border:1.5px solid #B0391B;border-radius:999px;background:#fff;color:#8A2B0E;font-size:14px;font-weight:700;padding:0 14px">Apagar</button>
    </div>
  </div>

  <nav aria-label="Principal" class="up" style="animation-delay:.6s;position:absolute;left:20px;right:20px;bottom:20px;height:68px;border-radius:26px;background:#0E2233;display:flex;align-items:center;justify-content:space-around;padding:0 10px;box-shadow:0 18px 34px -12px rgba(6,24,40,.7)">
    <a href="Main.dc.html" aria-label="Perguntar" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a>
    <a href="Cofre.dc.html" aria-label="Cofre" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9DB8CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></a>
    <a href="Ajustes.dc.html" aria-current="page" style="min-width:108px;height:48px;border-radius:18px;background:#fff;color:#0E2233;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px;font-weight:700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12689E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const on = (k, d) => (s[k] === undefined ? d : s[k]);
    const chip = (k, d) => {
      const v = on(k, d);
      const base = 'min-height:44px;border-radius:999px;font-weight:700;font-size:14px;padding:0 16px;display:flex;align-items:center;gap:6px;';
      return {
        on: v,
        tap: () => this.setState({ [k]: !v }),
        style: v
          ? base + 'border:0;background:#12689E;color:#fff'
          : base + 'border:1.5px solid #7C98AD;background:#fff;color:#0E2233'
      };
    };
    return { t1: chip('t1', true), t2: chip('t2', false), t3: chip('t3', false) };
  }
}
</script>
</body>
</html>
